# Diese Seite ist die Peripherie (slave)

CONFIG_BT_PERIPHERAL=y

# BLE-Verbindungsparameter: stromsparend
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=24
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=40
CONFIG_BT_PERIPHERAL_PREF_LATENCY=30
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=500
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
CONFIG_BT_DIS_ALLOW_CONNECTION_PARAM_REQ=y

# Sendeleistung reduzieren
CONFIG_BT_CTLR_TX_PWR_PLUS_0=y

# Power-Management aktivieren
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_CPU_OPS=y
CONFIG_DEEP_SLEEP=y

# Stromversorgung: Akku
CONFIG_ZMK_EXT_POWER=n

# Optional: Komponenten deaktivieren, wenn nicht benötigt
CONFIG_USB_DEVICE_STACK=n
CONFIG_ZMK_DISPLAY=n
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_RGB_MATRIX=n
