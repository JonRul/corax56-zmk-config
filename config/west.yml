manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: petejohanson
      url-base: https://github.com/petejohanson
    - name: urob
      url-base: https://github.com/urob
    - name: adolto
      url-base: https://github.com/adolto

  projects:
    - name: zmk
      import: app/west.yml
      remote: zmkfirmware
      revision: main
    - name: zmk-driver-ams-as5600
      remote: adolto
      revision: main
      path: modules/input/zmk-driver-ams-as5600
